<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign HUD Overlay Test</title>
    
    <!-- Babylon.js for the 3D world canvas -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* The sovereign HUD container */
        #sovereign-hud-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Let clicks pass through to game canvas by default */
            z-index: 10000;
            overflow: hidden;
            color: #ffffff;
            font-family: Verdana, sans-serif;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>

    <!-- 3D World Canvas -->
    <canvas id="renderCanvas"></canvas>
    
    <!-- HUD Overlay Container -->
    <div id="sovereign-hud-overlay"></div>

    <script>
        // --- 1. Babylon.js 3D World Setup ---
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 10, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;
            const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {diameter: 2, segments: 32}, scene);
            sphere.position.y = 1;
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 6, height: 6}, scene);
            
            // Simple rotation animation to prove the 3D world is "alive" underneath
            scene.onBeforeRenderObservable.add(() => {
                sphere.rotation.y += 0.01;
            });
            
            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => {
            scene.render();
        });
        window.addEventListener("resize", () => {
            engine.resize();
        });


        // --- 2. HUD Overlay Render Logic (Port of HUDOverlayLimb) ---
        class ClientHUDOverlay {
            constructor() {
                this.container = document.getElementById('sovereign-hud-overlay');
                this.componentMap = new Map();
            }

            render(renderedInterface) {
                this.clearInterface(renderedInterface.interfaceId);
                
                renderedInterface.components.forEach(comp => {
                    if (!comp.visible) return;
                    
                    const el = document.createElement('div');
                    el.id = `if-${renderedInterface.interfaceId}-comp-${comp.id}`;
                    el.style.cssText = this.computeStyles(comp);
                    el.style.pointerEvents = 'auto'; // Re-enable clicks for HUD interaction

                    if (comp.type === 'TEXT' && comp.content?.text) {
                        el.innerHTML = comp.content.text;
                        el.style.fontFamily = comp.content.font || 'Verdana, sans-serif';
                        el.style.color = comp.content.color || '#ffffff';
                    } else if (comp.type === 'FIGURE' && comp.content?.color) {
                        el.style.backgroundColor = comp.content.color;
                    }

                    // Interactive Events
                    if (comp.scripts?.onClick !== undefined) {
                        el.style.cursor = 'pointer';
                        el.addEventListener('click', (e) => {
                            console.log(`[CS2 Dispatch] onClick: ${comp.scripts.onClick}`, comp);
                            e.stopPropagation(); // Don't click the 3D world
                            
                            // Simulate a visual state change (e.g. CC_SETONCLICK)
                            el.style.transform = 'scale(0.95)';
                            setTimeout(() => el.style.transform = 'none', 100);
                        });
                    }

                    if (comp.scripts?.onHover !== undefined) {
                        el.addEventListener('mouseenter', () => {
                            console.log(`[CS2 Dispatch] onHover: ${comp.scripts.onHover}`);
                        });
                    }

                    this.container.appendChild(el);
                    this.componentMap.set(`${renderedInterface.interfaceId}:${comp.id}`, el);
                });
            }

            computeStyles(comp) {
                const styles = [
                    'position: absolute',
                    comp.cssPosition || `left: ${comp.x}px; top: ${comp.y}px`,
                    comp.cssSize || `width: ${comp.width}px; height: ${comp.height}px`,
                    'box-sizing: border-box',
                    'border: 1px solid rgba(255, 255, 255, 0.1)' // Debug outline
                ];
                return styles.join('; ');
            }

            clearInterface(interfaceId) {
                for (const [key, el] of this.componentMap) {
                    if (key.startsWith(`${interfaceId}:`)) {
                        el.remove();
                        this.componentMap.delete(key);
                    }
                }
            }
        }

        // --- 3. Mock Data Injection (Interface 703 representation) ---
        const overlay = new ClientHUDOverlay();
        
        // Example mock data that would normally be fetched via JSON from InterfaceRuntimeLimb
        const mockRenderedData = {
            interfaceId: 703,
            components: [
                {
                    id: 50,
                    x: 10, y: 10, width: 200, height: 100,
                    visible: true,
                    type: 'FIGURE',
                    content: { color: '#1a1a1a' },
                    cssPosition: 'left: 10px; top: 10px;',
                    cssSize: 'width: 200px; height: 100px;'
                },
                {
                    id: 51,
                    x: 20, y: 20, width: 160, height: 30,
                    visible: true,
                    type: 'TEXT',
                    content: { text: 'Settings Menu', color: '#ffd700' },
                    scripts: { onClick: 28556 },
                    cssPosition: 'left: 20px; top: 20px;',
                    cssSize: 'width: 160px; height: 30px;'
                }
            ]
        };

        // Render the HUD over the 3D world
        setTimeout(() => {
            overlay.render(mockRenderedData);
        }, 1000); // 1s delay to prove it overlays AFTER 3D load

    </script>
</body>
</html>
