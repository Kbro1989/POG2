<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sovereign Edge Radar — Movement Truth Visualizer</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08080e;
    color: #c8c8d0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-size: 20px; font-weight: 600; color: #e0e0e8; letter-spacing: 0.5px; }
  .subtitle { font-size: 12px; color: #555; margin-bottom: 14px; }
  .controls {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; justify-content: center;
  }
  .controls label { font-size: 12px; color: #888; }
  .controls input, .controls select {
    background: #14141e; border: 1px solid #2a2a35;
    color: #c8c8d0; padding: 5px 8px; border-radius: 5px; font-size: 12px;
  }
  .controls button {
    background: linear-gradient(135deg, #1a4a6b, #0f324a);
    border: 1px solid #2a6a8a; color: #e0f0ff;
    padding: 7px 14px; border-radius: 5px; cursor: pointer;
    font-size: 12px; font-weight: 500; transition: all 0.2s;
  }
  .controls button:hover { background: linear-gradient(135deg, #226a8e, #156b6b); }
  #status { font-size: 11px; color: #666; margin-bottom: 6px; min-height: 16px; }
  .canvas-wrap {
    position: relative; border: 1px solid #1a1a25;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  canvas { display: block; image-rendering: pixelated; }
  .legend {
    display: flex; gap: 14px; margin-top: 12px;
    flex-wrap: wrap; justify-content: center;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #777; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid #333; }
  #tooltip {
    position: fixed; background: #12121f; border: 1px solid #2a2a40;
    padding: 8px 12px; border-radius: 6px; font-size: 11px;
    pointer-events: none; display: none; z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,0.7); line-height: 1.5;
    max-width: 280px;
  }
  .edge-label { font-family: monospace; font-size: 10px; }
  .stat-row { display:flex; gap:20px; margin-top:10px; font-size:11px; color:#888; }
  .stat-row b { color: #51ffff; }
</style>
</head>
<body>

<h1>⚡ Sovereign Edge Radar</h1>
<div class="subtitle">Phase B3 Movement Truth — canStand(tile) + canTransit(edge) + diagonalRule</div>

<div class="controls">
  <label>Region X: <input type="number" id="rx" value="50" min="0" max="127" style="width:55px"></label>
  <label>Region Y: <input type="number" id="ry" value="50" min="0" max="200" style="width:55px"></label>
  <label>Scale: <select id="scale">
    <option value="8">8x</option>
    <option value="12" selected>12x</option>
    <option value="16">16x</option>
  </select></label>
  <label style="color:#51ffff"><input type="checkbox" id="showEdges" checked onchange="redraw()"> Edge Overlay</label>
  <label style="color:#ffaa33"><input type="checkbox" id="showEntities" checked onchange="redraw()"> Entities</label>
  <button onclick="loadRegion()">Load Region</button>
  <input type="file" id="filePicker" accept=".json" style="display:none">
  <button onclick="document.getElementById('filePicker').click()">Load File</button>
</div>

<div id="status">Load a ms_X_Y.json from the synthesizer</div>

<div class="canvas-wrap">
  <canvas id="radar" width="768" height="768"></canvas>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#0f1a12"></div> Walkable</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#dc322f"></div> Blocked (solid)</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#1a4a6b"></div> Water</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#6b4a1a"></div> Bridge</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#ff3030; border:2px solid #ff3030"></div> Wall Edge (blocked)</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#51ffff"></div> NPC Spawn</div>
</div>

<div class="stat-row" id="stats"></div>

<div id="tooltip"></div>

<script>
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let regionData = null;
let matrixMap = {};   // "x_y" -> { walkable, surfaceType, edges, sourceFlags }
let entities = [];
let worldOriginX = 0, worldOriginY = 0;

function surfaceColor(tile) {
  if (!tile) return [8, 8, 14];
  if (!tile.walkable) return [220, 50, 47];
  switch (tile.surfaceType) {
    case 'water':   return [26, 74, 107];
    case 'bridge':  return [107, 74, 26];
    default:        return [15, 26, 18];
  }
}

function redraw() {
  if (!regionData) return;
  const scale = parseInt(document.getElementById('scale').value);
  const showEdges = document.getElementById('showEdges').checked;
  const showEntities = document.getElementById('showEntities').checked;
  const size = 64;

  canvas.width = size * scale;
  canvas.height = size * scale;

  // Pass 1: Tile fill
  const imgData = ctx.createImageData(canvas.width, canvas.height);
  for (let lx = 0; lx < size; lx++) {
    for (let ly = 0; ly < size; ly++) {
      const wx = worldOriginX + lx;
      const wy = worldOriginY + ly;
      const key = `${wx}_${wy}`;
      const tile = matrixMap[key];
      const color = surfaceColor(tile);

      for (let dx = 0; dx < scale; dx++) {
        for (let dy = 0; dy < scale; dy++) {
          const px = lx * scale + dx;
          const py = (size - 1 - ly) * scale + dy;
          const idx = (py * canvas.width + px) * 4;
          imgData.data[idx]     = color[0];
          imgData.data[idx + 1] = color[1];
          imgData.data[idx + 2] = color[2];
          imgData.data[idx + 3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // Pass 2: Edge overlay (drawn as lines on tile boundaries)
  if (showEdges) {
    ctx.lineWidth = Math.max(1, scale / 6);
    
    for (let lx = 0; lx < size; lx++) {
      for (let ly = 0; ly < size; ly++) {
        const wx = worldOriginX + lx;
        const wy = worldOriginY + ly;
        const key = `${wx}_${wy}`;
        const tile = matrixMap[key];
        if (!tile || !tile.edges) continue;

        const canvasX = lx * scale;
        const canvasY = (size - 1 - ly) * scale;

        // North edge = top of the tile cell (canvasY)
        if (tile.edges.northBlocked) {
          ctx.strokeStyle = '#ff3030';
          ctx.beginPath();
          ctx.moveTo(canvasX, canvasY);
          ctx.lineTo(canvasX + scale, canvasY);
          ctx.stroke();
        }
        // South edge = bottom of the tile cell (canvasY + scale)
        if (tile.edges.southBlocked) {
          ctx.strokeStyle = '#ff3030';
          ctx.beginPath();
          ctx.moveTo(canvasX, canvasY + scale);
          ctx.lineTo(canvasX + scale, canvasY + scale);
          ctx.stroke();
        }
        // East edge = right side (canvasX + scale)
        if (tile.edges.eastBlocked) {
          ctx.strokeStyle = '#ff3030';
          ctx.beginPath();
          ctx.moveTo(canvasX + scale, canvasY);
          ctx.lineTo(canvasX + scale, canvasY + scale);
          ctx.stroke();
        }
        // West edge = left side (canvasX)
        if (tile.edges.westBlocked) {
          ctx.strokeStyle = '#ff3030';
          ctx.beginPath();
          ctx.moveTo(canvasX, canvasY);
          ctx.lineTo(canvasX, canvasY + scale);
          ctx.stroke();
        }
      }
    }
  }

  // Pass 3: Entity markers
  if (showEntities && entities.length > 0) {
    for (const ent of entities) {
      const lx = ent.x - worldOriginX;
      const ly = ent.y - worldOriginY;
      if (lx < 0 || lx >= size || ly < 0 || ly >= size) continue;

      const px = lx * scale + scale / 2;
      const py = (size - 1 - ly) * scale + scale / 2;

      const isNpc = ent.type === 'npc';
      ctx.beginPath();
      ctx.arc(px, py, scale / 3, 0, Math.PI * 2);
      ctx.fillStyle = isNpc ? 'rgba(81, 255, 255, 0.7)' : 'rgba(180, 120, 255, 0.6)';
      ctx.fill();

      if (scale >= 12 && ent.name) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(9, scale / 1.4)}px Segoe UI`;
        ctx.textAlign = 'center';
        ctx.fillText(ent.name, px, py - scale / 2.2);
      }
    }
  }

  // Stats
  let totalTiles = 0, blockedTiles = 0, edgedTiles = 0;
  for (const key of Object.keys(matrixMap)) {
    totalTiles++;
    const t = matrixMap[key];
    if (!t.walkable) blockedTiles++;
    if (t.edges && (t.edges.northBlocked || t.edges.southBlocked || t.edges.eastBlocked || t.edges.westBlocked)) edgedTiles++;
  }
  document.getElementById('stats').innerHTML =
    `<span>Tiles: <b>${totalTiles}</b></span>
     <span>Blocked: <b>${blockedTiles}</b></span>
     <span>Edge-constrained: <b>${edgedTiles}</b></span>
     <span>Entities: <b>${entities.length}</b></span>`;
}

function ingestData(data) {
  regionData = data;
  matrixMap = {};
  entities = [];

  // Determine world origin
  const rx = data.rx ?? 0;
  const ry = data.ry ?? 0;
  worldOriginX = rx * 64;
  worldOriginY = ry * 64;

  // Ingest collision matrix
  if (data.collision_matrix) {
    for (const [key, val] of Object.entries(data.collision_matrix)) {
      matrixMap[key] = val;
    }
  }

  // Ingest entities
  if (data.entities && Array.isArray(data.entities)) {
    entities = data.entities;
  }

  document.getElementById('status').textContent =
    `Region [${rx}, ${ry}] loaded. ${Object.keys(matrixMap).length} tiles, ${entities.length} entities.`;

  redraw();
}

async function loadRegion() {
  const rx = document.getElementById('rx').value;
  const ry = document.getElementById('ry').value;
  const filename = `ms_${rx}_${ry}.json`;
  document.getElementById('status').textContent = `Loading ${filename}...`;

  try {
    const resp = await fetch(`http://localhost:8080/${filename}`);
    if (!resp.ok) {
      document.getElementById('status').textContent = `${filename} not found (${resp.status})`;
      return;
    }
    const data = await resp.json();
    ingestData(data);
  } catch (err) {
    document.getElementById('status').textContent = `Error: ${err.message}`;
  }
}

// Tooltip
canvas.addEventListener('mousemove', (e) => {
  if (!regionData) return;
  const rect = canvas.getBoundingClientRect();
  const scale = parseInt(document.getElementById('scale').value);
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const lx = Math.floor(mx / scale);
  const ly = 63 - Math.floor(my / scale);

  if (lx < 0 || lx >= 64 || ly < 0 || ly >= 64) {
    tooltip.style.display = 'none';
    return;
  }

  const wx = worldOriginX + lx;
  const wy = worldOriginY + ly;
  const key = `${wx}_${wy}`;
  const tile = matrixMap[key];

  let html = `<b>[${wx}, ${wy}]</b> local [${lx}, ${ly}]<br>`;

  if (tile) {
    const walkIcon = tile.walkable ? '✅' : '🚫';
    html += `Surface: <b>${tile.surfaceType || 'terrain'}</b> ${walkIcon}<br>`;
    html += `Flags: <b>0x${(tile.sourceFlags || 0).toString(16)}</b><br>`;

    if (tile.edges) {
      const e = tile.edges;
      const arrow = (blocked) => blocked ? '<span style="color:#ff3030">■</span>' : '<span style="color:#2a8a62">□</span>';
      html += `<span class="edge-label">`;
      html += `N:${arrow(e.northBlocked)} S:${arrow(e.southBlocked)} `;
      html += `E:${arrow(e.eastBlocked)} W:${arrow(e.westBlocked)}`;
      html += `</span><br>`;
    }
  } else {
    html += '<i style="color:#555">No data</i>';
  }

  // Entities at this tile
  const tileEnts = entities.filter(en => en.x === wx && en.y === wy);
  if (tileEnts.length > 0) {
    html += `<br><b>${tileEnts.length} entity(s):</b><br>`;
    for (const en of tileEnts.slice(0, 3)) {
      const color = en.type === 'npc' ? '#51ffff' : '#b080ff';
      html += `• <span style="color:${color}">${en.name || en.id}</span> (${en.type})<br>`;
    }
  }

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top = (e.clientY + 14) + 'px';
});

canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// File picker
document.getElementById('filePicker').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      ingestData(JSON.parse(reader.result));
    } catch (err) {
      document.getElementById('status').textContent = `Parse error: ${err.message}`;
    }
  };
  reader.readAsText(file);
});

// Drag and drop
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      ingestData(JSON.parse(reader.result));
    } catch (err) {
      document.getElementById('status').textContent = `Parse error: ${err.message}`;
    }
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
